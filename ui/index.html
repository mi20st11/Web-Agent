<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Agent</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体异步加载：国内网络下不挡住首屏，加载不到就用系统字体 -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --ground: #f9fbfc;
    --surface: #ffffff;
    --raised: #f4f6f8;
    --active: #ebedee;
    --border: #e8eaec;
    --rule: #f0f1f2;
    --control: #cdced1;
    --text: #131416;
    --muted: #5d5f60;
    --faint: #6d7175;
    --accent: #1b6c80;
    --positive: #1e7b4f;
    --negative: #c4242a;
    --warning: #92400e;
    --sans: "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --r-card: 8px;
    --r-control: 6px;
    --r-sheet: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1214;
      --surface: #14181b;
      --raised: #1a1f23;
      --active: #232a2f;
      --border: #262d31;
      --rule: #1e2427;
      --control: #3a4247;
      --text: #e8ecee;
      --muted: #9aa4a8;
      --faint: #93a0a4;
      --accent: #5fb6c9;
      --positive: #4fbf86;
      --negative: #e57373;
      --warning: #d9a05a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  b, strong { font-weight: 600; }

  .app {
    display: grid;
    grid-template-columns: 228px minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------------- 侧栏 ---------------- */
  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 14px 12px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
  .mark { width: 26px; height: 26px; color: var(--accent); flex: none; }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .side-block { padding: 12px 0; border-top: 1px solid var(--rule); }
  .side-label { font-size: 11px; color: var(--muted); padding: 0 8px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 32px; padding: 0 8px;
    border: 0; border-radius: var(--r-control);
    background: transparent; text-align: left;
    font-size: 13px; color: var(--text);
  }
  .nav-item:hover { background: var(--active); }
  .nav-item.primary { background: var(--text); color: var(--surface); }
  .nav-item.primary:hover { background: #000; }
  @media (prefers-color-scheme: dark) {
    .nav-item.primary:hover { background: #fff; color: #000; }
  }
  .nav-item .k { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .ws-card {
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--surface);
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .ws-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-path { margin-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }

  .row-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 30px; padding: 0 8px;
    font-size: 12.5px; color: var(--muted);
  }
  .row-toggle input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
  .row-field {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 30px; padding: 0 8px;
    font-size: 12.5px; color: var(--muted);
  }
  .row-field select {
    height: 26px; min-width: 84px; padding: 0 6px;
    border: 1px solid var(--control); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
    font: inherit; font-size: 12.5px;
  }
  .row-field select:disabled { color: var(--faint); opacity: 1; }
  .row-toggle input[type="number"] {
    width: 54px; padding: 2px 6px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface);
    font-family: var(--mono); font-size: 12px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .side-note { margin-top: 8px; padding: 0 8px; font-size: 12px; line-height: 1.5; color: var(--faint); }

  .side-foot {
    margin-top: auto; padding: 10px 8px 0;
    border-top: 1px solid var(--rule);
    display: flex; flex-wrap: wrap; gap: 2px 12px;
    font-size: 12px; color: var(--faint);
  }
  .side-foot kbd {
    font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
    padding: 0 3px; margin-right: 3px;
  }

  /* ---------------- 主区 ---------------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 8px 8px 0; }
  .topbar { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; }
  .conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); min-width: 0; }
  .conn span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--positive); }
  .dot.warn { background: var(--warning); }
  .dot.err { background: var(--negative); }
  .dot.busy { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .top-actions { margin-left: auto; display: flex; gap: 6px; }
  .btn {
    height: 28px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
    font-size: 12px;
  }
  .btn:hover { background: var(--raised); border-color: var(--control); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { background: var(--active); color: var(--text); }
  .btn.danger { color: var(--negative); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: #175b6b; border-color: #175b6b; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .sheet {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sheet);
    overflow: hidden;
  }

  .sheet-head {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .head-text { min-width: 0; }
  h1 {
    margin: 0; font-size: 22px; font-weight: 600;
    letter-spacing: -0.015em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    margin-top: 2px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    word-break: break-all;
  }
  .head-stats {
    margin-left: auto; padding-top: 5px;
    display: flex; gap: 16px;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .head-stats b { font-weight: 500; color: var(--text); }
  .head-stats .bad b { color: var(--negative); }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .log { max-width: 760px; margin: 0 auto; padding: 6px 24px 28px; width: 100%; }
  /* 空状态在纸面里居中：下半屏不留一整块空白 */
  .log.is-empty { margin-top: auto; margin-bottom: auto; }

  /* ---------------- 时间线：动作账本 ---------------- */
  .entry { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .entry:last-child { border-bottom: 0; }
  .meta-row { display: flex; align-items: baseline; gap: 8px; }
  .who { font-size: 12px; font-weight: 500; }
  .who.bot { color: var(--accent); }
  .time { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .body { margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .entry.user .body { white-space: pre-wrap; }

  .entry.notice { padding: 9px 0; border-bottom: 0; }
  .notice-text {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 12px; color: var(--muted);
  }
  .notice-text::before {
    content: ""; width: 2px; align-self: stretch;
    background: var(--control); border-radius: 2px; flex: none;
  }
  .notice-text.warn { color: var(--warning); }
  .notice-text.warn::before { background: var(--warning); }
  .notice-text.error { color: var(--negative); }
  .notice-text.error::before { background: var(--negative); }

  details.tool { border-bottom: 1px solid var(--rule); }
  details.tool > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    height: 46px; user-select: none;
    font-size: 12px;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  .t-name { font-family: var(--mono); font-size: 11.5px; font-weight: 500; min-width: 46px; }
  .t-arg {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .t-status { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .t-status.ok { color: var(--positive); }
  .t-status.err { color: var(--negative); }
  details.tool pre {
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--r-card);
    background: var(--raised);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow: auto;
  }
  .spin {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--control); border-top-color: var(--accent);
    animation: rot 0.8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------------- 回答正文 ---------------- */
  .rich p { margin: 0 0 8px; white-space: pre-wrap; }
  .rich p:last-child { margin-bottom: 0; }
  .rich code {
    font-family: var(--mono); font-size: 0.92em;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 4px;
  }
  .codeblock {
    margin: 10px 0;
    border: 1px solid var(--border); border-radius: var(--r-card);
    overflow: hidden; background: var(--raised);
  }
  .codeblock-head {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .codeblock-head .spacer { flex: 1; }
  .copy { border: 0; background: transparent; color: var(--muted); font-size: 11px; padding: 0; }
  .copy:hover { color: var(--accent); }
  .codeblock pre {
    margin: 0; padding: 10px 12px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    overflow-x: auto; white-space: pre;
  }

  /* ---------------- 空状态 / 引导 ---------------- */
  .onboard { padding: 44px 0 20px; max-width: 540px; }
  .onboard h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .onboard p { margin: 0 0 18px; font-size: 13px; color: var(--muted); max-width: 52ch; }
  .recent { margin-top: 22px; border-top: 1px solid var(--rule); }
  .recent-label { font-size: 12px; color: var(--muted); padding: 10px 0 4px; }
  .recent-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; height: 38px; padding: 0 2px;
    border: 0; border-bottom: 1px solid var(--rule);
    background: none; text-align: left;
    font-size: 13px; color: var(--muted);
  }
  .recent-item:hover { color: var(--text); }
  .recent-item .mono { font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-item .go { margin-left: auto; color: var(--faint); font-size: 11px; }

  .start { padding: 40px 0 8px; }
  .start-lead { margin: 0 0 4px; font-size: 15px; }
  .start-sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  .steps { margin-top: 24px; border-top: 1px solid var(--rule); }
  .step {
    display: grid; grid-template-columns: 26px 74px 1fr; align-items: baseline;
    gap: 8px; padding: 9px 2px;
    border-bottom: 1px solid var(--rule);
    font-size: 13px; color: var(--muted);
  }
  .step .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .step b { font-weight: 500; color: var(--text); }

  /* ---------------- 审批条 ---------------- */
  .approval {
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--warning) 6%, var(--surface));
    padding: 12px 24px;
  }
  .approval-inner { max-width: 760px; margin: 0 auto; }
  .a-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--warning); }
  .a-detail {
    margin: 8px 0 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface);
    font-family: var(--mono); font-size: 11.5px;
    white-space: pre-wrap; max-height: 160px; overflow: auto;
  }
  .a-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .approval textarea {
    width: 100%; min-height: 60px; margin-bottom: 10px;
    padding: 7px 9px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); resize: vertical;
  }

  /* ---------------- 输入区 ---------------- */
  .composer-wrap { border-top: 1px solid var(--rule); padding: 12px 24px 14px; background: var(--surface); }
  .composer {
    max-width: 760px; margin: 0 auto;
    padding: 8px 10px 8px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface);
    transition: border-color 0.15s;
  }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea {
    width: 100%; min-height: 24px; max-height: 200px;
    padding: 2px 0; border: 0; outline: 0;
    background: transparent; resize: none; line-height: 1.55;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .hint { flex: 1; min-height: 16px; font-size: 12px; color: var(--faint); }
  .send {
    height: 28px; padding: 0 14px;
    border: 1px solid var(--accent); border-radius: var(--r-control);
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 500;
  }
  .send:hover { background: #175b6b; border-color: #175b6b; }
  .send:disabled { opacity: 0.45; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 22px;
    transform: translate(-50%, 10px);
    padding: 7px 13px;
    border-radius: var(--r-control);
    background: var(--text); color: var(--surface);
    font-size: 12.5px; max-width: 70vw;
    opacity: 0; pointer-events: none;
    transition: opacity 0.16s, transform 0.16s;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 0; }
    .sheet { border: 0; border-radius: 0; }
    .log, .composer-wrap, .approval { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <path d="M9.5 9l3 3-3 3"/>
        <path d="M14.5 15h1.5"/>
      </svg>
      <div>
        <div class="brand-name">Web Agent</div>
        <div class="brand-sub">本地工作台</div>
      </div>
    </div>

    <div class="side-block" style="border-top:0;padding-top:0">
      <button class="nav-item primary" id="btn-new">新对话</button>
      <button class="nav-item" id="btn-focus">打开 DeepSeek 窗口</button>
    </div>

    <div class="side-block">
      <div class="side-label">工程目录</div>
      <div class="ws-card">
        <div class="ws-name" id="ws-name">未选择</div>
        <div class="ws-path" id="ws-path">先在中间选一个文件夹</div>
      </div>
      <button class="nav-item" id="btn-workspace">更换工程目录</button>
    </div>

    <div class="side-block">
      <div class="side-label">运行</div>
      <label class="row-field"><span>浏览器</span>
        <select id="browser-select" title="切换后会在新的浏览器窗口里打开 DeepSeek">
          <option value="edge">Edge</option>
          <option value="chrome">Chrome</option>
        </select>
      </label>
      <label class="row-toggle"><span>自动批准危险命令</span><input type="checkbox" id="auto-approve"></label>
      <label class="row-toggle"><span>最大工具步数</span><input type="number" id="max-steps" min="1" max="80"></label>
      <div class="side-note">备份与调用记录存在 ~/.web-agent 下，工程目录里不落文件。</div>
    </div>

    <div class="side-foot">
      <span><kbd>Enter</kbd>发送</span>
      <span><kbd>Shift</kbd><kbd>Enter</kbd>换行</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">正在连接 DeepSeek…</span></div>
      <div class="top-actions">
        <button class="btn quiet" id="btn-clear">清空界面</button>
        <button class="btn danger" id="btn-stop" hidden>停止</button>
      </div>
    </header>

    <section class="sheet">
      <header class="sheet-head">
        <div class="head-text">
          <h1 id="title">工程目录</h1>
          <div class="sub" id="subtitle">还没有选择文件夹</div>
        </div>
        <div class="head-stats" id="stats"></div>
      </header>

      <div class="scroll" id="scroll">
        <div class="log" id="log">
          <div id="entries"></div>

          <section class="onboard" id="onboard" hidden>
            <h2>选一个工程文件夹</h2>
            <p>它读文件、改代码、跑命令都只在这个目录里。选完会记住，下次启动直接进来。</p>
            <button class="btn accent" id="btn-pick">选择文件夹…</button>
            <div class="steps">
              <div class="step"><span class="n">01</span><b>选目录</b><span>读写只发生在里面，改前自动备份</span></div>
              <div class="step"><span class="n">02</span><b>说任务</b><span>一句话就够，它会自己拆成几步</span></div>
              <div class="step"><span class="n">03</span><b>看账本</b><span>每个动作一行，输出可以展开</span></div>
            </div>
            <div class="recent" id="recent" hidden>
              <div class="recent-label">最近用过</div>
              <div id="recent-list"></div>
            </div>
          </section>

          <section class="start" id="empty">
            <p class="start-lead">说一句要做什么，它就开始动手。</p>
            <p class="start-sub">每一步工具调用都摆在下面，危险命令会先停下来问你。</p>
          </section>
        </div>
      </div>

      <div class="approval" id="approval" hidden>
        <div class="approval-inner">
          <div class="a-head"><span class="dot warn"></span><span id="approval-title"></span></div>
          <div class="a-detail" id="approval-detail"></div>
          <textarea id="approval-text" placeholder="回答它的问题…" hidden></textarea>
          <div class="a-actions">
            <button class="btn" id="btn-deny">拒绝</button>
            <button class="btn accent" id="btn-allow">允许</button>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="让 Web Agent 做点什么…"></textarea>
          <div class="composer-row">
            <div class="hint" id="hintline">它会直接动工作区里的文件</div>
            <button class="send" id="btn-send" disabled>发送</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = {
    entries: $('entries'), scroll: $('scroll'), log: $('log'), onboard: $('onboard'), empty: $('empty'),
    input: $('input'), send: $('btn-send'), stop: $('btn-stop'),
    connDot: $('conn-dot'), connText: $('conn-text'),
    title: $('title'), subtitle: $('subtitle'), stats: $('stats'),
    wsName: $('ws-name'), wsPath: $('ws-path'),
    autoApprove: $('auto-approve'), maxSteps: $('max-steps'), browserSelect: $('browser-select'),
    approval: $('approval'), approvalTitle: $('approval-title'),
    approvalDetail: $('approval-detail'), approvalText: $('approval-text'),
    btnAllow: $('btn-allow'), btnDeny: $('btn-deny'),
    hintline: $('hintline'), toast: $('toast'),
    recent: $('recent'), recentList: $('recent-list'),
  };

  let state = null;
  let es = null;
  let esOk = false;
  let lastLen = 0;
  const nodes = new Map();     // id -> element
  const sigs = new Map();      // id -> string，判断工具行要不要重画
  const toggles = new Map();   // id -> bool，用户手动展开/收起过
  let pendingKey = '';
  let switchingBrowser = false;
  const BROWSER_LABEL = { edge: 'Edge', chrome: 'Chrome' };

  /* ---------------- 小工具 ---------------- */
  const toast = (() => {
    let timer;
    return (text) => {
      el.toast.textContent = text;
      el.toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => el.toast.classList.remove('show'), 2400);
    };
  })();

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-web-agent': '1' },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  function time(ts) {
    try {
      return new Date(ts).toLocaleTimeString('zh-CN', {
        hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    } catch { return ''; }
  }

  function baseName(p) {
    if (!p) return '';
    const parts = String(p).split(/[\\/]/).filter(Boolean);
    return parts[parts.length - 1] || p;
  }

  function argSummary(item) {
    if (item.name === 'shell') return (item.bodyPreview || '').split('\n')[0].slice(0, 90);
    const a = item.args || {};
    return a.path || a.url || a.question || '';
  }

  /* ---------------- 富文本 ---------------- */
  function renderRich(text) {
    const frag = document.createDocumentFragment();
    const src = String(text || '');
    const fence = /```([^\n`]*)\n([\s\S]*?)```/g;
    let last = 0;
    let m;

    const addText = (chunk) => {
      if (!chunk) return;
      const p = document.createElement('div');
      p.className = 'rich';
      const parts = chunk.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g);
      for (const part of parts) {
        if (!part) continue;
        if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
          const c = document.createElement('code');
          c.textContent = part.slice(1, -1);
          p.appendChild(c);
        } else if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
          const b = document.createElement('strong');
          b.textContent = part.slice(2, -2);
          p.appendChild(b);
        } else {
          p.appendChild(document.createTextNode(part));
        }
      }
      frag.appendChild(p);
    };

    while ((m = fence.exec(src))) {
      addText(src.slice(last, m.index));
      const lang = (m[1] || 'text').trim() || 'text';
      const box = document.createElement('div');
      box.className = 'codeblock';
      const head = document.createElement('div');
      head.className = 'codeblock-head';
      const l = document.createElement('span');
      l.textContent = lang;
      const sp = document.createElement('span');
      sp.className = 'spacer';
      const btn = document.createElement('button');
      btn.className = 'copy';
      btn.textContent = '复制';
      btn.onclick = () => {
        navigator.clipboard?.writeText(m[2]).then(
          () => toast('已复制'),
          () => toast('复制失败'),
        );
      };
      head.append(l, sp, btn);
      const pre = document.createElement('pre');
      pre.textContent = m[2].replace(/\n$/, '');
      box.append(head, pre);
      frag.appendChild(box);
      last = m.index + m[0].length;
    }
    addText(src.slice(last));
    return frag;
  }

  /* ---------------- 工具行 ---------------- */
  function toolSig(item) {
    return [item.status, item.ok, item.ms, String(item.output || '').length,
      JSON.stringify(item.args || null), item.bodyPreview || ''].join('|');
  }

  function buildTool(item) {
    const details = document.createElement('details');
    details.className = 'tool';
    details.dataset.id = item.id;

    const summary = document.createElement('summary');
    const dot = document.createElement(item.status === 'running' ? 'span' : 'span');
    dot.className = item.status === 'running' ? 'spin' : 'dot ' + (item.ok ? 'ok' : 'err');
    const name = document.createElement('span');
    name.className = 't-name';
    name.textContent = item.name;
    const arg = document.createElement('span');
    arg.className = 't-arg';
    arg.textContent = argSummary(item);
    const status = document.createElement('span');
    status.className = 't-status ' + (item.status === 'running' ? '' : (item.ok ? 'ok' : 'err'));
    status.textContent = item.status === 'running'
      ? '运行中'
      : (item.ok ? '完成' : '失败') + ' · ' + (item.ms / 1000).toFixed(1) + 's';
    summary.append(dot, name, arg, status);

    const pre = document.createElement('pre');
    pre.textContent = item.output || (item.status === 'running' ? '…' : '（没有输出）');

    details.append(summary, pre);
    details.open = toggles.has(item.id)
      ? toggles.get(item.id)
      : (item.status === 'running' || item.ok === false || String(item.output || '').length < 900);
    details.addEventListener('toggle', () => toggles.set(item.id, details.open));
    return details;
  }

  function updateTool(node, item) {
    const fresh = buildTool(item);
    node.replaceChildren(...fresh.childNodes);
    node.open = toggles.has(item.id)
      ? toggles.get(item.id)
      : (item.status === 'running' || item.ok === false || String(item.output || '').length < 900);
  }

  function buildEntry(item) {
    if (item.type === 'tool') return buildTool(item);

    const wrap = document.createElement('div');
    wrap.className = 'entry ' + item.type;
    wrap.dataset.id = item.id;

    if (item.type === 'notice') {
      const box = document.createElement('div');
      box.className = 'notice-text ' + (item.level || '');
      box.textContent = item.text;
      wrap.appendChild(box);
      return wrap;
    }

    const head = document.createElement('div');
    head.className = 'meta-row';
    const who = document.createElement('span');
    who.className = 'who' + (item.type === 'assistant' ? ' bot' : '');
    who.textContent = item.type === 'assistant' ? 'DeepSeek' : '你';
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = time(item.ts);
    head.append(who, t);

    const body = document.createElement('div');
    body.className = 'body';
    if (item.type === 'assistant') body.appendChild(renderRich(item.text));
    else body.textContent = item.text;

    wrap.append(head, body);
    return wrap;
  }

  function renderTimeline() {
    if (!state) return;
    const list = state.timeline || [];
    const ids = new Set(list.map((x) => x.id));

    for (const [id, node] of nodes) {
      if (!ids.has(id)) {
        if (node.classList?.contains('tool')) node.remove();
        else node.remove();
        nodes.delete(id);
        sigs.delete(id);
        toggles.delete(id);
      }
    }

    for (const item of list) {
      const node = nodes.get(item.id);
      if (!node) {
        const fresh = buildEntry(item);
        nodes.set(item.id, fresh);
        el.entries.appendChild(fresh);
        if (item.type === 'tool') sigs.set(item.id, toolSig(item));
        continue;
      }
      if (item.type === 'tool') {
        const sig = toolSig(item);
        if (sigs.get(item.id) !== sig) {
          sigs.set(item.id, sig);
          const fresh = buildTool(item);
          node.replaceChildren(...fresh.childNodes);
          // 保留用户的展开选择
          node.open = toggles.has(item.id)
            ? toggles.get(item.id)
            : (item.status === 'running' || item.ok === false || String(item.output || '').length < 900);
        }
      }
    }

    const hasUser = list.some((x) => x.type === 'user');
    el.empty.hidden = hasUser || !state.workspace;
    el.onboard.hidden = !!state.workspace;
    el.log.classList.toggle('is-empty', !hasUser);

    const grew = list.length > lastLen;
    lastLen = list.length;
    if (grew) {
      const nearBottom = el.scroll.scrollHeight - el.scroll.scrollTop - el.scroll.clientHeight < 260;
      if (nearBottom || list.length <= 2) {
        requestAnimationFrame(() => { el.scroll.scrollTop = el.scroll.scrollHeight; });
      }
    }
  }

  /* ---------------- 框架状态 ---------------- */
  const CONN = {
    connecting: ['busy', '正在连接 DeepSeek…'],
    'not-ready': ['warn', 'DeepSeek 未就绪'],
    ready: ['ok', 'DeepSeek 已连接'],
    'signed-out': ['err', 'DeepSeek 未登录'],
    blocked: ['err', '浏览器禁用了网站数据'],
    error: ['err', '连接出错'],
  };

  function renderChrome() {
    if (!state) return;
    const busy = state.status === 'busy';
    const ws = state.workspace;

    el.send.disabled = busy || !ws || !el.input.value.trim();
    el.stop.hidden = !busy;
    el.input.disabled = !ws;
    el.input.placeholder = ws ? '让 Web Agent 做点什么…' : '先在中间选一个工程文件夹';

    const [cls, text] = busy && state.connection === 'ready'
      ? ['busy', '正在生成…']
      : (CONN[state.connection] || CONN.connecting);
    el.connDot.className = 'dot ' + cls;
    el.connText.textContent = state.connection === 'error' && state.connectionDetail
      ? state.connectionDetail
      : text;
    el.connText.title = state.connectionDetail || '';

    el.title.textContent = ws ? baseName(ws) : '工程目录';
    el.subtitle.textContent = ws || '还没有选择文件夹';

    el.wsName.textContent = ws ? baseName(ws) : '未选择';
    el.wsPath.textContent = ws || '先在中间选一个文件夹';

    el.autoApprove.checked = !!state.settings?.autoApprove;
    if (document.activeElement !== el.maxSteps) el.maxSteps.value = state.settings?.maxSteps ?? 30;

    const b = state.browser;
    if (b && el.browserSelect) {
      if (!switchingBrowser) el.browserSelect.value = b.name || 'edge';
      el.browserSelect.disabled = !b.canSwitch || busy || !!b.switching;
      el.browserSelect.title = b.canSwitch
        ? '换浏览器会关掉当前 DeepSeek 窗口，用新窗口重连'
        : '本次启动指定了 --profile 或 --cdp，不能切换';
    }

    el.hintline.textContent = !ws
      ? '选好目录后才能开始'
      : busy
        ? '工具在跑，结果会自动贴回 DeepSeek'
        : (state.settings?.autoApprove ? '自动批准已开：危险命令不再询问' : '危险命令会先停下来问你');

    const tools = (state.timeline || []).filter((x) => x.type === 'tool');
    const ok = tools.filter((x) => x.status !== 'running' && x.ok).length;
    const bad = tools.filter((x) => x.status !== 'running' && !x.ok).length;
    el.stats.innerHTML = '';
    if (tools.length) {
      const a = document.createElement('span');
      a.append(`${tools.length} 个动作`);
      el.stats.appendChild(a);
      const b = document.createElement('span');
      b.append(document.createTextNode('成功 '));
      const bb = document.createElement('b');
      bb.textContent = String(ok);
      b.appendChild(bb);
      el.stats.appendChild(b);
      if (bad) {
        const c = document.createElement('span');
        c.className = 'bad';
        c.append(document.createTextNode('失败 '));
        const cb = document.createElement('b');
        cb.textContent = String(bad);
        c.appendChild(cb);
        el.stats.appendChild(c);
      }
    }

    renderRecents();
    renderApproval();
  }

  function renderRecents() {
    const list = (state?.recentWorkspaces || []).filter((p) => p !== state?.workspace).slice(0, 5);
    el.recent.hidden = !list.length;
    el.recentList.replaceChildren();
    for (const p of list) {
      const b = document.createElement('button');
      b.className = 'recent-item';
      b.title = p;
      const name = document.createElement('span');
      name.textContent = baseName(p);
      const path = document.createElement('span');
      path.className = 'mono';
      path.textContent = p;
      const go = document.createElement('span');
      go.className = 'go';
      go.textContent = '打开';
      b.append(name, path, go);
      b.onclick = () => chooseWorkspace(p);
      el.recentList.appendChild(b);
    }
  }

  function renderApproval() {
    const p = state?.pending;
    const key = p ? p.id : '';
    if (key === pendingKey) return;
    pendingKey = key;
    if (!p) {
      el.approval.hidden = true;
      return;
    }
    el.approval.hidden = false;
    el.approvalTitle.textContent = p.title;
    el.approvalDetail.textContent = p.detail || '';
    el.approvalDetail.hidden = p.kind === 'question';
    el.approvalText.hidden = p.kind !== 'question';
    el.approvalText.value = '';
    el.btnAllow.textContent = p.kind === 'question' ? '提交' : '允许';
    el.btnDeny.textContent = p.kind === 'question' ? '跳过' : '拒绝';
    if (p.kind === 'question') el.approvalText.focus();
  }

  let switchPoll = null;
  let switchTries = 0;
  function applyState(next) {
    state = next;
    renderChrome();
    renderTimeline();
    // 换浏览器时新窗口往往在切换完成前就打开了，可能错过最后一次推送：
    // 只要状态里还在切换，就补拉一次，直到下拉解锁。
    if (!state?.browser?.switching) switchTries = 0;
    if (state?.browser?.switching && !switchPoll && switchTries < 15) {
      switchPoll = setTimeout(async () => {
        switchPoll = null;
        switchTries++;
        try {
          const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
          applyState(s);
        } catch { /* 下一个事件会再试 */ }
      }, 1200);
    }
  }

  /* ---------------- SSE ---------------- */
  function connect() {
    es = new EventSource('/api/events');
    es.addEventListener('state', (e) => {
      esOk = true;
      try { applyState(JSON.parse(e.data)); } catch { /* 半截数据先丢掉 */ }
    });
    es.onopen = () => {
      esOk = true;
      api('/api/state').then(applyState).catch(() => {});
    };
    es.onerror = () => {
      if (!esOk) return;
      esOk = false;
      el.connDot.className = 'dot err';
      el.connText.textContent = '界面服务断开，重连中';
    };
  }

  /* ---------------- 交互 ---------------- */
  function send() {
    const text = el.input.value.trim();
    if (!text) return;
    if (!state?.workspace) { toast('先选一个工程文件夹'); return; }
    el.input.value = '';
    autosize();
    el.send.disabled = true;
    api('/api/send', { text }).catch((e) => {
      toast(e.message);
      el.input.value = text;
      autosize();
    });
  }

  function autosize() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(200, el.input.scrollHeight) + 'px';
  }

  async function chooseWorkspace(path) {
    try {
      const r = await api('/api/workspace', path ? { path } : {});
      if (r.cancelled) toast('没有选择文件夹');
      else toast('工程目录：' + r.workspace);
    } catch (e) {
      toast(e.message);
    }
  }

  el.input.addEventListener('input', () => {
    autosize();
    el.send.disabled = !el.input.value.trim() || !state?.workspace || state?.status === 'busy';
  });
  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  el.send.addEventListener('click', send);
  el.stop.addEventListener('click', () => api('/api/stop', {}).catch((e) => toast(e.message)));

  el.btnAllow.addEventListener('click', () => {
    const p = state?.pending;
    if (!p) return;
    api('/api/respond', { id: p.id, allow: true, text: el.approvalText.value })
      .catch((e) => toast(e.message));
  });
  el.btnDeny.addEventListener('click', () => {
    const p = state?.pending;
    if (!p) return;
    api('/api/respond', { id: p.id, allow: false, text: '' }).catch((e) => toast(e.message));
  });

  $('btn-new').addEventListener('click', () => {
    const hasTalk = state?.timeline?.some((x) => x.type === 'user');
    if (hasTalk && !confirm('新对话会清空当前记录，DeepSeek 那边也会开新会话。继续？')) return;
    api('/api/new', {}).then(() => toast('已开新对话')).catch((e) => toast(e.message));
  });

  $('btn-focus').addEventListener('click', () => {
    api('/api/focus', {}).then((r) => { if (!r.ok) toast('没找到 DeepSeek 窗口'); }).catch((e) => toast(e.message));
  });

  $('btn-workspace').addEventListener('click', () => chooseWorkspace(''));
  $('btn-pick').addEventListener('click', () => chooseWorkspace(''));

  $('btn-clear').addEventListener('click', () => {
    nodes.forEach((n) => n.remove());
    nodes.clear();
    sigs.clear();
    toggles.clear();
    lastLen = 0;
    if (state) {
      state.timeline = [];
      el.empty.hidden = false;
    }
    toast('界面已清空，DeepSeek 上下文还在');
  });

  el.browserSelect.addEventListener('change', async () => {
    const name = el.browserSelect.value;
    switchingBrowser = true;
    el.browserSelect.disabled = true;
    toast(`正在切到 ${BROWSER_LABEL[name] || name}…`);
    try {
      const r = await api('/api/browser', { name });
      toast(`已切到 ${BROWSER_LABEL[r.browser?.name] || name}，DeepSeek 窗口会重新打开`);
    } catch (err) {
      toast(err.message);
    } finally {
      switchingBrowser = false;
      if (state?.browser) el.browserSelect.value = state.browser.name;
    }
  });

  el.autoApprove.addEventListener('change', () => {
    api('/api/settings', { autoApprove: el.autoApprove.checked }).catch((e) => toast(e.message));
  });
  el.maxSteps.addEventListener('change', () => {
    const n = Number(el.maxSteps.value);
    if (Number.isFinite(n)) api('/api/settings', { maxSteps: n }).catch((e) => toast(e.message));
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state?.pending) {
      api('/api/respond', { id: state.pending.id, allow: false, text: '' }).catch(() => {});
    }
  });

  fetch('/api/state').then((r) => r.json()).then(applyState).catch(() => {});
  connect();
})();
</script>
</body>
</html>
