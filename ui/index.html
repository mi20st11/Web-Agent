<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Agent</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体异步加载：国内网络下不挡住首屏，加载不到就用系统字体 -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --ground: #f9fbfc;
    --surface: #ffffff;
    --raised: #f4f6f8;
    --active: #ebedee;
    --border: #e8eaec;
    --rule: #f0f1f2;
    --control: #cdced1;
    --text: #131416;
    --muted: #5d5f60;
    --faint: #6d7175;
    --accent: #1b6c80;
    --positive: #1e7b4f;
    --negative: #c4242a;
    --warning: #92400e;
    --sans: "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --r-card: 8px;
    --r-control: 6px;
    --r-sheet: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1214;
      --surface: #14181b;
      --raised: #1a1f23;
      --active: #232a2f;
      --border: #262d31;
      --rule: #1e2427;
      --control: #3a4247;
      --text: #e8ecee;
      --muted: #9aa4a8;
      --faint: #93a0a4;
      --accent: #5fb6c9;
      --positive: #4fbf86;
      --negative: #e57373;
      --warning: #d9a05a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  b, strong { font-weight: 600; }

  .app {
    display: grid;
    grid-template-columns: 228px minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------------- 侧栏 ---------------- */
  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 12px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
  .mark { width: 26px; height: 26px; color: var(--accent); flex: none; }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .side-block { padding: 12px 0; border-top: 1px solid var(--rule); }
  .side-label { font-size: 11px; color: var(--muted); padding: 0 8px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 32px; padding: 0 8px;
    border: 0; border-radius: var(--r-control);
    background: transparent; text-align: left;
    font-size: 13px; color: var(--text);
  }
  .nav-item:hover { background: var(--active); }
  .nav-item.primary { background: var(--text); color: var(--surface); }
  .nav-item.primary:hover { background: #000; }
  @media (prefers-color-scheme: dark) {
    .nav-item.primary:hover { background: #fff; color: #000; }
  }
  .nav-item .k { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .ws-card {
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--surface);
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .ws-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-path { margin-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }

  .row-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 30px; padding: 0 8px;
    font-size: 12.5px; color: var(--muted);
  }
  .row-toggle input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
  .row-field {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 30px; padding: 0 8px;
    font-size: 12.5px; color: var(--muted);
  }
  .row-field select {
    height: 26px; min-width: 84px; padding: 0 6px;
    border: 1px solid var(--control); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
    font: inherit; font-size: 12.5px;
  }
  .row-field select:disabled { color: var(--faint); opacity: 1; }
  .row-toggle input[type="number"] {
    width: 54px; padding: 2px 6px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--surface);
    font-family: var(--mono); font-size: 12px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .side-note { margin-top: 8px; padding: 0 8px; font-size: 12px; line-height: 1.5; color: var(--faint); }

  /* 看板娘素材：鲸鱼娘（精致版）idle 序列帧。
     Copyright (c) dsh-pet contributors — https://github.com/zhu1090093659/dsh-pet
     Licensed under the Apache License, Version 2.0: http://www.apache.org/licenses/LICENSE-2.0
     来源：satellites/dsh-pet 的 assets/whale-refined/spritesheet.webp（commit ae2c9d4）。
     本项目的修改：只取第 0 行 idle 的 6 帧，裁掉透明边、缩放到 132×143、重编码为 WebP，
     再把逐帧时长（500/500/600/500/500/600 ms）写进下面的 MASCOT_FRAMES。
     完整归属与许可证见仓库根目录的 THIRD_PARTY_NOTICES.md。 */
  /* 尺寸按 --mascot-scale 缩：原画一格 132×143，缩到刚好塞进快捷键提示右边的空档。 */
  .mascot {
    --mascot-scale: 0.58;
    position: fixed; left: 139px; bottom: 12px; z-index: 40;
    width: calc(132px * var(--mascot-scale));
    height: calc(143px * var(--mascot-scale));
    cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  /* 窗口不够高时它会压到侧栏的快捷键提示，宁可先藏起来。 */
  @media (max-height: 720px), (max-width: 800px) { .mascot { display: none; } }
  .mascot.dragging { cursor: grabbing; }
  .mascot-sprite {
    width: 100%; height: 100%;
    background-repeat: no-repeat;
    background-size: calc(792px * var(--mascot-scale)) calc(143px * var(--mascot-scale));
    background-position: 0 0;
  }

  .side-foot {
    margin-top: 12px; padding: 10px 8px 0;
    border-top: 1px solid var(--rule);
    display: flex; flex-wrap: wrap; gap: 2px 12px;
    font-size: 12px; color: var(--faint);
  }
  .side-foot kbd {
    font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
    padding: 0 3px; margin-right: 3px;
  }

  /* ---------------- 主区 ---------------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 8px 8px 0; }
  .topbar { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; }
  .conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); min-width: 0; }
  .conn span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--positive); }
  .dot.warn { background: var(--warning); }
  .dot.err { background: var(--negative); }
  .dot.busy { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .top-actions { margin-left: auto; display: flex; gap: 6px; }
  .btn {
    height: 28px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); color: var(--text);
    font-size: 12px;
  }
  .btn:hover { background: var(--raised); border-color: var(--control); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { background: var(--active); color: var(--text); }
  .btn.danger { color: var(--negative); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: #175b6b; border-color: #175b6b; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .sheet {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sheet);
    overflow: hidden;
  }

  .sheet-head {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .head-text { min-width: 0; }
  h1 {
    margin: 0; font-size: 22px; font-weight: 600;
    letter-spacing: -0.015em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    margin-top: 2px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    word-break: break-all;
  }
  .head-stats {
    margin-left: auto; padding-top: 5px;
    display: flex; gap: 16px;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .head-stats b { font-weight: 500; color: var(--text); }
  .head-stats .bad b { color: var(--negative); }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .log { max-width: 760px; margin: 0 auto; padding: 6px 24px 28px; width: 100%; }
  /* 空状态在纸面里居中：下半屏不留一整块空白 */
  .log.is-empty { margin-top: auto; margin-bottom: auto; }

  /* ---------------- 时间线：动作账本 ---------------- */
  /* 每条消息一张卡：框住它，"谁说的、要干什么"一眼看清 */
  .entry {
    margin: 0 0 9px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--surface);
  }
  .entry.user { background: var(--raised); }
  .entry.assistant { border-left: 2px solid color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .meta-row { display: flex; align-items: baseline; gap: 8px; }
  .who { font-size: 12px; font-weight: 500; }
  .who.bot { color: var(--accent); }
  .time { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .body { margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .entry.user .body { white-space: pre-wrap; }
  .body:empty { display: none; }

  /* 它请求执行的动作：一行一条，只留名字和对象 */
  .cmds { margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 6px; }
  .cmds-label { font-size: 11px; color: var(--faint); }
  .cmd {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--raised); font-family: var(--mono); font-size: 11.5px;
  }
  .cmd .c-name { flex: none; color: var(--accent); }
  .cmd .c-arg { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 回答下面的胶囊：把工程文件退回这条之前 */
  .entry-foot { margin-top: 10px; display: flex; gap: 8px; }
  .pill {
    height: 26px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); font-size: 11.5px;
  }
  .pill:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .pill:disabled { opacity: .5; }

  .entry.notice { margin: 2px 0 9px; padding: 4px 2px; border: 0; background: none; }
  .notice-text {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 12px; color: var(--muted);
  }
  .notice-text::before {
    content: ""; width: 2px; align-self: stretch;
    background: var(--control); border-radius: 2px; flex: none;
  }
  .notice-text.warn { color: var(--warning); }
  .notice-text.warn::before { background: var(--warning); }
  .notice-text.error { color: var(--negative); }
  .notice-text.error::before { background: var(--negative); }

  details.tool { border-bottom: 1px solid var(--rule); }
  details.tool > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    height: 46px; user-select: none;
    font-size: 12px;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  .t-name { font-family: var(--mono); font-size: 11.5px; font-weight: 500; min-width: 46px; }
  .t-arg {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .t-status { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .t-status.ok { color: var(--positive); }
  .t-status.err { color: var(--negative); }
  details.tool pre {
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--r-card);
    background: var(--raised);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow: auto;
  }
  .spin {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--control); border-top-color: var(--accent);
    animation: rot 0.8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------------- 回答正文 ---------------- */
  .rich p { margin: 0 0 8px; white-space: pre-wrap; }
  .rich p:last-child { margin-bottom: 0; }
  .rich code {
    font-family: var(--mono); font-size: 0.92em;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 4px;
  }
  .codeblock {
    margin: 10px 0;
    border: 1px solid var(--border); border-radius: var(--r-card);
    overflow: hidden; background: var(--raised);
  }
  .codeblock-head {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .codeblock-head .spacer { flex: 1; }
  .copy { border: 0; background: transparent; color: var(--muted); font-size: 11px; padding: 0; }
  .copy:hover { color: var(--accent); }
  .codeblock pre {
    margin: 0; padding: 10px 12px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    overflow-x: auto; white-space: pre;
  }

  /* ---------------- 空状态 / 引导 ---------------- */
  .onboard { padding: 44px 0 20px; max-width: 540px; }
  .onboard h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .onboard p { margin: 0 0 18px; font-size: 13px; color: var(--muted); max-width: 52ch; }
  .recent { margin-top: 22px; border-top: 1px solid var(--rule); }
  .recent-label { font-size: 12px; color: var(--muted); padding: 10px 0 4px; }
  .recent-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; height: 38px; padding: 0 2px;
    border: 0; border-bottom: 1px solid var(--rule);
    background: none; text-align: left;
    font-size: 13px; color: var(--muted);
  }
  .recent-item:hover { color: var(--text); }
  .recent-item .mono { font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-item .go { margin-left: auto; color: var(--faint); font-size: 11px; }

  .start { padding: 40px 0 8px; }
  .start-lead { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; }
  .start-sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  .steps { margin-top: 24px; border-top: 1px solid var(--rule); }
  .step {
    display: grid; grid-template-columns: 26px 74px 1fr; align-items: baseline;
    gap: 8px; padding: 9px 2px;
    border-bottom: 1px solid var(--rule);
    font-size: 13px; color: var(--muted);
  }
  .step .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .step b { font-weight: 500; color: var(--text); }

  /* ---------------- 审批条 ---------------- */
  .approval {
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--warning) 6%, var(--surface));
    padding: 12px 24px;
  }
  .approval-inner { max-width: 760px; margin: 0 auto; }
  .a-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--warning); }
  .a-detail {
    margin: 8px 0 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface);
    font-family: var(--mono); font-size: 11.5px;
    white-space: pre-wrap; max-height: 160px; overflow: auto;
  }
  .a-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .approval textarea {
    width: 100%; min-height: 60px; margin-bottom: 10px;
    padding: 7px 9px;
    border: 1px solid var(--border); border-radius: var(--r-control);
    background: var(--surface); resize: vertical;
  }

  /* ---------------- 输入区 ---------------- */
  .composer-wrap { border-top: 1px solid var(--rule); padding: 12px 24px 14px; background: var(--surface); }
  .composer {
    max-width: 760px; margin: 0 auto;
    padding: 8px 10px 8px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface);
    transition: border-color 0.15s;
  }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea {
    width: 100%; min-height: 24px; max-height: 200px;
    padding: 2px 0; border: 0; outline: 0;
    background: transparent; resize: none; line-height: 1.55;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .hint { flex: 1; min-height: 16px; font-size: 12px; color: var(--faint); }
  .send {
    height: 28px; padding: 0 14px;
    border: 1px solid var(--accent); border-radius: var(--r-control);
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 500;
  }
  .send:hover { background: #175b6b; border-color: #175b6b; }
  .send:disabled { opacity: 0.45; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; top: 14px;
    transform: translate(-50%, -16px) scale(0.94);
    padding: 8px 17px;
    border-radius: 999px;
    background: rgba(28, 28, 30, 0.9);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    backdrop-filter: blur(12px) saturate(180%);
    color: #fff;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.07) inset;
    max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; pointer-events: none;
    will-change: transform, opacity;
    transition: opacity 0.18s ease, transform 0.44s cubic-bezier(0.22, 1.28, 0.36, 1);
    z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 0; }
    .sheet { border: 0; border-radius: 0; }
    .log, .composer-wrap, .approval { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <path d="M9.5 9l3 3-3 3"/>
        <path d="M14.5 15h1.5"/>
      </svg>
      <div>
        <div class="brand-name">Web Agent</div>
        <div class="brand-sub">本地工作台</div>
      </div>
    </div>

    <div class="side-block" style="border-top:0;padding-top:0">
      <button class="nav-item primary" id="btn-new">新对话</button>
      <button class="nav-item" id="btn-focus">打开对话窗口</button>
    </div>

    <div class="side-block">
      <div class="side-label">工程目录</div>
      <div class="ws-card">
        <div class="ws-name" id="ws-name">未选择</div>
        <div class="ws-path" id="ws-path">先在中间选一个文件夹</div>
      </div>
      <button class="nav-item" id="btn-workspace">更换工程目录</button>
    </div>

    <div class="side-block">
      <div class="side-label">运行</div>
      <label class="row-field"><span>网页端</span>
        <select id="site-select" title="切换网页端会在当前窗口里打开另一个站点">
          <option value="deepseek">DeepSeek</option>
          <option value="gemini">Gemini</option>
        </select>
      </label>
      <label class="row-field"><span>浏览器</span>
        <select id="browser-select" title="换浏览器会关掉当前浏览器，用另一个重开（界面窗口跟着过去）">
          <option value="edge">Edge</option>
          <option value="chrome">Chrome</option>
        </select>
      </label>
      <label class="row-field"><span>提示词</span>
        <select id="prompt-profile" title="按哪种系统写命令：自动跟随本机，或手动指定 Windows / Linux">
          <option value="auto">自动</option>
          <option value="windows">Windows</option>
          <option value="linux">Linux</option>
        </select>
      </label>
      <div class="side-note" id="env-note"></div>
      <label class="row-toggle"><span>Git 快照</span><input type="checkbox" id="git-enabled"></label>
      <label class="row-toggle"><span>自动批准危险命令</span><input type="checkbox" id="auto-approve"></label>
      <label class="row-toggle"><span>最大工具步数</span><input type="number" id="max-steps" min="1" max="80"></label>
    </div>

    <div class="side-foot">
      <span><kbd>Enter</kbd>发送</span>
      <span><kbd>Shift</kbd><kbd>Enter</kbd>换行</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">正在连接…</span></div>
      <div class="top-actions">
        <button class="btn quiet" id="btn-clear">清空界面</button>
        <button class="btn danger" id="btn-stop" hidden>停止</button>
      </div>
    </header>

    <section class="sheet">
      <header class="sheet-head">
        <div class="head-text">
          <h1 id="title">工程目录</h1>
          <div class="sub" id="subtitle">还没有选择文件夹</div>
        </div>
        <div class="head-stats" id="stats"></div>
      </header>

      <div class="scroll" id="scroll">
        <div class="log" id="log">
          <div id="entries"></div>

          <section class="onboard" id="onboard" hidden>
            <h2>选一个工程文件夹</h2>
            <p>它读文件、改代码、跑命令都只在这个目录里。选完会记住，下次启动直接进来。</p>
            <button class="btn accent" id="btn-pick">选择文件夹…</button>
            <div class="steps">
              <div class="step"><span class="n">01</span><b>选目录</b><span>读写只发生在里面，动手前打快照</span></div>
              <div class="step"><span class="n">02</span><b>说任务</b><span>一句话就够，它会自己拆成几步</span></div>
              <div class="step"><span class="n">03</span><b>看账本</b><span>每个动作一行，输出可以展开</span></div>
            </div>
            <div class="recent" id="recent" hidden>
              <div class="recent-label">最近用过</div>
              <div id="recent-list"></div>
            </div>
          </section>

          <section class="start" id="empty">
            <p class="start-lead" id="greeting"></p>
          </section>
        </div>
      </div>

      <div class="approval" id="approval" hidden>
        <div class="approval-inner">
          <div class="a-head"><span class="dot warn"></span><span id="approval-title"></span></div>
          <div class="a-detail" id="approval-detail"></div>
          <textarea id="approval-text" placeholder="回答它的问题…" hidden></textarea>
          <div class="a-actions">
            <button class="btn" id="btn-deny">拒绝</button>
            <button class="btn accent" id="btn-allow">允许</button>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="让 Web Agent 做点什么…"></textarea>
          <div class="composer-row">
            <div class="hint" id="hintline">它会直接动工作区里的文件</div>
            <button class="send" id="btn-send" disabled>发送</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="mascot" id="mascot" aria-hidden="true">
  <div class="mascot-sprite" id="mascot-sprite"></div>
</div>
<div class="toast" id="toast"></div>

  const MASCOT_FRAMES = [500, 500, 600, 500, 500, 600];

  function startMascot() {
    const sprite = $('mascot-sprite');
    if (!sprite || !MASCOT_SHEET) return;
    sprite.style.backgroundImage = `url("${MASCOT_SHEET}")`;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let i = 0;
    const tick = () => {
      const step = sprite.clientWidth || 132;  // 每帧宽 = 元素宽（原画 132，按 CSS 缩过）
      sprite.style.backgroundPosition = `${-i * step}px 0`;
      const wait = MASCOT_FRAMES[i];
      i = (i + 1) % MASCOT_FRAMES.length;
      setTimeout(tick, wait);
    };
    tick();
  }

  /* 看板娘可以拖到任意位置；位置记在本机，下次进来还在那儿。 */
  function startMascotDrag() {
    const m = $('mascot');
    if (!m) return;
    const KEY = 'wa-mascot-pos-v2';
    const edge = 8;
    const clamp = (x, y) => {
      const w = m.offsetWidth, h = m.offsetHeight;
      return {
        x: Math.min(Math.max(edge, x), Math.max(edge, innerWidth - w - edge)),
        y: Math.min(Math.max(edge, y), Math.max(edge, innerHeight - h - edge)),
      };
    };
    const place = (x, y) => {
      m.style.left = `${x}px`; m.style.top = `${y}px`; m.style.bottom = 'auto';
    };
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
        const p = clamp(saved.x, saved.y); place(p.x, p.y);
      }
    } catch {}
    let drag = null;
    m.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const r = m.getBoundingClientRect();
      drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, id: e.pointerId };
      m.setPointerCapture(e.pointerId);
      m.classList.add('dragging');
    });
    m.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const p = clamp(e.clientX - drag.dx, e.clientY - drag.dy);
      place(p.x, p.y);
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null;
      m.classList.remove('dragging');
      const r = m.getBoundingClientRect();
      try { localStorage.setItem(KEY, JSON.stringify({ x: Math.round(r.left), y: Math.round(r.top) })); } catch {}
    };
    m.addEventListener('pointerup', end);
    m.addEventListener('pointercancel', end);
    addEventListener('resize', () => {
      const r = m.getBoundingClientRect();
      const p = clamp(r.left, r.top); place(p.x, p.y);
    });
  }

  /* ---------------- 小工具 ---------------- */
  const toast = (() => {
    let timer;
    return (text) => {
      el.toast.textContent = text;
      el.toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => el.toast.classList.remove('show'), 2400);
    };
  })();

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-web-agent': '1' },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      throw new Error(data.error || (res.ok ? '操作没成功' : 'HTTP ' + res.status));
    }
    return data;
  }

  function time(ts) {
    try {
      return new Date(ts).toLocaleTimeString('zh-CN', {
        hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    } catch { return ''; }
  }

  function baseName(p) {
    if (!p) return '';
    const parts = String(p).split(/[\\/]/).filter(Boolean);
    return parts[parts.length - 1] || p;
  }

  function argSummary(item) {
    if (item.name === 'shell') return (item.bodyPreview || '').split('\n')[0].slice(0, 90);
    const a = item.args || {};
    return a.path || a.url || a.question || '';
  }

  /* ---------------- 富文本 ---------------- */
  // 网页端的回答只留人话：代码块整段拿掉（它想干什么，下面那排命令已经写清楚了）
  function renderRich(text) {
    const frag = document.createDocumentFragment();
    const src = String(text || '')
      .replace(/```[^\n`]*\n[\s\S]*?```/g, '')
      .replace(/```[\s\S]*$/g, '') // 没闭合的围栏，后面全不要
      .replace(/\n{3,}/g, '\n\n')
      .trim();
    if (!src) return frag;

    const p = document.createElement('div');
    p.className = 'rich';
    const parts = src.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g);
    for (const part of parts) {
      if (!part) continue;
      if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
        const c = document.createElement('code');
        c.textContent = part.slice(1, -1);
        p.appendChild(c);
      } else if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
        const b = document.createElement('strong');
        b.textContent = part.slice(2, -2);
        p.appendChild(b);
      } else {
        p.appendChild(document.createTextNode(part));
      }
    }
    frag.appendChild(p);
    return frag;
  }

  /* ---------------- 工具行 ---------------- */
  function toolSig(item) {
    return [item.status, item.ok, item.ms, String(item.output || '').length,
      JSON.stringify(item.args || null), item.bodyPreview || ''].join('|');
  }

  function buildTool(item) {
    const details = document.createElement('details');
    details.className = 'tool';
    details.dataset.id = item.id;

    const summary = document.createElement('summary');
    const dot = document.createElement(item.status === 'running' ? 'span' : 'span');
    dot.className = item.status === 'running' ? 'spin' : 'dot ' + (item.ok ? 'ok' : 'err');
    const name = document.createElement('span');
    name.className = 't-name';
    name.textContent = item.name;
    const arg = document.createElement('span');
    arg.className = 't-arg';
    arg.textContent = argSummary(item);
    const status = document.createElement('span');
    status.className = 't-status ' + (item.status === 'running' ? '' : (item.ok ? 'ok' : 'err'));
    status.textContent = item.status === 'running'
      ? '运行中'
      : (item.ok ? '完成' : '失败') + ' · ' + (item.ms / 1000).toFixed(1) + 's';
    summary.append(dot, name, arg, status);

    const pre = document.createElement('pre');
    pre.textContent = item.output || (item.status === 'running' ? '…' : '（没有输出）');

    details.append(summary, pre);
    details.open = toggles.has(item.id)
      ? toggles.get(item.id)
      : (item.status === 'running' || item.ok === false || String(item.output || '').length < 900);
    details.addEventListener('toggle', () => toggles.set(item.id, details.open));
    return details;
  }

  function updateTool(node, item) {
    const fresh = buildTool(item);
    node.replaceChildren(...fresh.childNodes);
    node.open = toggles.has(item.id)
      ? toggles.get(item.id)
      : (item.status === 'running' || item.ok === false || String(item.output || '').length < 900);
  }

  /** 回答卡片底部：它请求执行的动作，一行一条。 */
  function buildCmds(item) {
    const list = Array.isArray(item.calls) ? item.calls : [];
    if (!list.length) return null;
    const box = document.createElement('div');
    box.className = 'cmds';
    const label = document.createElement('div');
    label.className = 'cmds-label';
    label.textContent = `请求执行 ${list.length} 个动作`;
    box.appendChild(label);
    for (const call of list) {
      const row = document.createElement('div');
      row.className = 'cmd';
      const name = document.createElement('span');
      name.className = 'c-name';
      name.textContent = call.name || '';
      const arg = document.createElement('span');
      arg.className = 'c-arg';
      arg.textContent = call.arg || '';
      arg.title = call.arg || '';
      row.append(name, arg);
      box.appendChild(row);
    }
    return box;
  }

  /** 把工程目录退回这条回答动手之前。 */
  async function restoreTo(item) {
    const short = String(item.git?.sha || '').slice(0, 7);
    const ok = confirm(
      `把工程目录恢复到这条回答之前？\n\n快照 ${short} 之后改过的文件会被还原，`
      + '这段时间新建的文件会被删掉。这一步不能撤销。',
    );
    if (!ok) return;
    try {
      const r = await api('/api/restore', { id: item.id });
      toast(`已回到 ${r.short || short} 那一刻`);
    } catch (e) {
      toast(e.message);
    }
  }

  function buildEntry(item) {
    if (item.type === 'tool') return buildTool(item);

    const wrap = document.createElement('div');
    wrap.className = 'entry ' + item.type;
    wrap.dataset.id = item.id;

    if (item.type === 'notice') {
      const box = document.createElement('div');
      box.className = 'notice-text ' + (item.level || '');
      box.textContent = item.text;
      wrap.appendChild(box);
      return wrap;
    }

    const head = document.createElement('div');
    head.className = 'meta-row';
    const who = document.createElement('span');
    who.className = 'who' + (item.type === 'assistant' ? ' bot' : '');
    who.textContent = item.type === 'assistant' ? siteName() : '你';
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = time(item.ts);
    head.append(who, t);

    const body = document.createElement('div');
    body.className = 'body';
    if (item.type === 'assistant') body.appendChild(renderRich(item.text));
    else body.textContent = item.text;

    wrap.append(head, body);

    if (item.type === 'assistant') {
      const cmds = buildCmds(item);
      if (cmds) wrap.appendChild(cmds);
      if (item.git?.sha && state?.git?.enabled) {
        const foot = document.createElement('div');
        foot.className = 'entry-foot';
        const back = document.createElement('button');
        back.className = 'pill';
        back.textContent = '↩ 回到这条之前';
        back.title = `快照 ${String(item.git.sha).slice(0, 7)}：把工程文件恢复到这条回答动手之前`;
        back.onclick = () => restoreTo(item);
        foot.appendChild(back);
        wrap.appendChild(foot);
      }
    }
    return wrap;
  }

  function renderTimeline() {
    if (!state) return;
    const list = state.timeline || [];
    const ids = new Set(list.map((x) => x.id));

    for (const [id, node] of nodes) {
      if (!ids.has(id)) {
        if (node.classList?.contains('tool')) node.remove();
        else node.remove();
        nodes.delete(id);
        sigs.delete(id);
        toggles.delete(id);
      }
    }

    for (const item of list) {
      const node = nodes.get(item.id);
      if (!node) {
        const fresh = buildEntry(item);
        nodes.set(item.id, fresh);
        el.entries.appendChild(fresh);
        if (item.type === 'tool') sigs.set(item.id, toolSig(item));
        continue;
      }
      if (item.type === 'tool') {
        const sig = toolSig(item);
        if (sigs.get(item.id) !== sig) {
          sigs.set(item.id, sig);
          const fresh = buildTool(item);
          node.replaceChildren(...fresh.childNodes);
          // 保留用户的展开选择
          node.open = toggles.has(item.id)
            ? toggles.get(item.id)
            : (item.status === 'running' || item.ok === false || String(item.output || '').length < 900);
        }
      }
    }

    const hasUser = list.some((x) => x.type === 'user');
    el.empty.hidden = hasUser || !state.workspace;
    el.onboard.hidden = !!state.workspace;
    el.log.classList.toggle('is-empty', !hasUser);

    // 每次回到空状态换一句问候
    if (!hasUser && state.workspace) {
      if (greetFor !== 'empty') {
        el.greeting.textContent = pickGreeting();
        greetFor = 'empty';
      }
    } else {
      greetFor = '';
    }

    if (list.length < lastLen) pinned = true; // 清空/换对话后重新跟到底部
    lastLen = list.length;
    scrollToBottomIfPinned();
  }

  // 跟着新内容往下走：用户往上翻就不打扰，翻回底部附近再自动跟。
  let pinned = true;
  const atBottom = () => el.scroll.scrollHeight - el.scroll.scrollTop - el.scroll.clientHeight < 80;
  function scrollToBottomIfPinned() {
    if (!pinned) return;
    requestAnimationFrame(() => { el.scroll.scrollTop = el.scroll.scrollHeight; });
  }
  el.scroll.addEventListener('scroll', () => { pinned = atBottom(); }, { passive: true });
  // 工具输出补进已有卡片时不会走 renderTimeline，用尺寸变化兜住这类原地长高
  new ResizeObserver(() => { if (pinned) scrollToBottomIfPinned(); }).observe(el.entries);

  /* ---------------- 框架状态 ---------------- */
  const CONN = {
    connecting: ['busy', () => `正在连接 ${siteName()}…`],
    'not-ready': ['warn', () => `${siteName()} 未就绪`],
    ready: ['ok', () => `${siteName()} 已连接`],
    'signed-out': ['err', () => `${siteName()} 未登录`],
    blocked: ['err', () => '浏览器禁用了网站数据'],
    error: ['err', () => '连接出错'],
  };

  function renderChrome() {
    if (!state) return;
    const busy = state.status === 'busy';
    const ws = state.workspace;

    el.send.disabled = busy || !ws || !el.input.value.trim();
    el.stop.hidden = !busy;
    el.input.disabled = !ws;
    el.input.placeholder = ws ? '让 Web Agent 做点什么…' : '先在中间选一个工程文件夹';

    const [cls, label] = busy && state.connection === 'ready'
      ? ['busy', () => '正在生成…']
      : (CONN[state.connection] || CONN.connecting);
    const text = typeof label === 'function' ? label() : label;
    el.connDot.className = 'dot ' + cls;
    el.connText.textContent = state.connection === 'error' && state.connectionDetail
      ? state.connectionDetail
      : text;
    el.connText.title = state.connectionDetail || '';

    el.title.textContent = ws ? baseName(ws) : '工程目录';
    el.subtitle.textContent = ws || '还没有选择文件夹';

    el.wsName.textContent = ws ? baseName(ws) : '未选择';
    el.wsPath.textContent = ws || '先在中间选一个文件夹';

    const focusBtn = $('btn-focus');
    if (focusBtn) focusBtn.textContent = `打开 ${siteName()} 窗口`;

    el.autoApprove.checked = !!state.settings?.autoApprove;
    if (el.gitEnabled) {
      el.gitEnabled.checked = !!state.settings?.gitEnabled;
      el.gitEnabled.title = state.settings?.gitEnabled && state.git?.error
        ? `没找到 git 命令：${state.git.error}`
        : '每次它动手前存一次 Git 快照；回答下面的胶囊能把文件退回那一刻';
    }
    if (document.activeElement !== el.maxSteps) el.maxSteps.value = state.settings?.maxSteps ?? 30;

    if (el.promptProfile) {
      const prof = state.settings?.promptProfile || 'auto';
      if (document.activeElement !== el.promptProfile) el.promptProfile.value = prof;
    }
    if (el.envNote) {
      const env = state.env;
      el.envNote.textContent = env
        ? `本机 ${env.osLabel} · ${env.shell}${env.python ? ` · Python ${env.python}` : ' · 没找到 Python'}`
        : '';
    }

    const b = state.browser;
    if (b && el.browserSelect) {
      if (!switchingBrowser) el.browserSelect.value = b.name || 'edge';
      el.browserSelect.disabled = !b.canSwitch || busy || !!b.switching;
      el.browserSelect.title = b.canSwitch
        ? `换浏览器会关掉当前浏览器，用另一个重开（界面窗口跟着过去）`
        : '本次启动指定了 --profile 或 --cdp，不能切换';
    }

    const s = state.site;
    if (s && el.siteSelect) {
      if (!switchingSite) el.siteSelect.value = s.key || 'deepseek';
      el.siteSelect.disabled = !s.canSwitch || busy || !!b?.switching;
      el.siteSelect.title = s.canSwitch
        ? '切换网页端会在当前窗口里打开另一个站点'
        : '这次启动用 --url 或 --match 指定了页面，不能切换';
    }

    el.hintline.textContent = !ws
      ? '选好目录后才能开始'
      : busy
        ? `工具在跑，结果会自动贴回 ${siteName()}`
        : (state.settings?.autoApprove ? '自动批准已开：危险命令不再询问' : '危险命令会先停下来问你');

    const tools = (state.timeline || []).filter((x) => x.type === 'tool');
    const ok = tools.filter((x) => x.status !== 'running' && x.ok).length;
    const bad = tools.filter((x) => x.status !== 'running' && !x.ok).length;
    el.stats.innerHTML = '';
    if (tools.length) {
      const a = document.createElement('span');
      a.append(`${tools.length} 个动作`);
      el.stats.appendChild(a);
      const b = document.createElement('span');
      b.append(document.createTextNode('成功 '));
      const bb = document.createElement('b');
      bb.textContent = String(ok);
      b.appendChild(bb);
      el.stats.appendChild(b);
      if (bad) {
        const c = document.createElement('span');
        c.className = 'bad';
        c.append(document.createTextNode('失败 '));
        const cb = document.createElement('b');
        cb.textContent = String(bad);
        c.appendChild(cb);
        el.stats.appendChild(c);
      }
    }

    renderRecents();
    renderApproval();
  }

  function renderRecents() {
    const list = (state?.recentWorkspaces || []).filter((p) => p !== state?.workspace).slice(0, 5);
    el.recent.hidden = !list.length;
    el.recentList.replaceChildren();
    for (const p of list) {
      const b = document.createElement('button');
      b.className = 'recent-item';
      b.title = p;
      const name = document.createElement('span');
      name.textContent = baseName(p);
      const path = document.createElement('span');
      path.className = 'mono';
      path.textContent = p;
      const go = document.createElement('span');
      go.className = 'go';
      go.textContent = '打开';
      b.append(name, path, go);
      b.onclick = () => chooseWorkspace(p);
      el.recentList.appendChild(b);
    }
  }

  function renderApproval() {
    const p = state?.pending;
    const key = p ? p.id : '';
    if (key === pendingKey) return;
    pendingKey = key;
    if (!p) {
      el.approval.hidden = true;
      return;
    }
    el.approval.hidden = false;
    el.approvalTitle.textContent = p.title;
    el.approvalDetail.textContent = p.detail || '';
    el.approvalDetail.hidden = p.kind === 'question';
    el.approvalText.hidden = p.kind !== 'question';
    el.approvalText.value = '';
    el.btnAllow.textContent = p.kind === 'question' ? '提交' : '允许';
    el.btnDeny.textContent = p.kind === 'question' ? '跳过' : '拒绝';
    if (p.kind === 'question') el.approvalText.focus();
  }

  let switchPoll = null;
  let switchTries = 0;
  function applyState(next) {
    state = next;
    renderChrome();
    renderTimeline();
    // 换浏览器时新窗口往往在切换完成前就打开了，可能错过最后一次推送：
    // 只要状态里还在切换，就补拉一次，直到下拉解锁。
    if (!state?.browser?.switching) switchTries = 0;
    if (state?.browser?.switching && !switchPoll && switchTries < 15) {
      switchPoll = setTimeout(async () => {
        switchPoll = null;
        switchTries++;
        try {
          const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
          applyState(s);
        } catch { /* 下一个事件会再试 */ }
      }, 1200);
    }
  }

  /* ---------------- SSE ---------------- */
  function connect() {
    es = new EventSource('/api/events');
    es.addEventListener('state', (e) => {
      esOk = true;
      try { applyState(JSON.parse(e.data)); } catch { /* 半截数据先丢掉 */ }
    });
    es.onopen = () => {
      esOk = true;
      // 补拉一次，接上断线期间错过的状态（不能用 POST 的 api()）
      fetch('/api/state', { cache: 'no-store' }).then((r) => r.json()).then(applyState).catch(() => {});
    };
    es.onerror = () => {
      if (!esOk) return;
      esOk = false;
      el.connDot.className = 'dot err';
      el.connText.textContent = '界面服务断开，重连中';
    };
  }

  /* ---------------- 交互 ---------------- */
  function send() {
    const text = el.input.value.trim();
    if (!text) return;
    if (!state?.workspace) { toast('先选一个工程文件夹'); return; }
    el.input.value = '';
    autosize();
    el.send.disabled = true;
    api('/api/send', { text }).catch((e) => {
      toast(e.message);
      el.input.value = text;
      autosize();
    });
  }

  function autosize() {
    // 先回到单行高度，再按溢出的行数长高；直接量 scrollHeight 在空输入时会多出一行
    el.input.style.height = '26px';
    const over = el.input.scrollHeight - el.input.clientHeight;
    if (over > 0) el.input.style.height = Math.min(200, 26 + over) + 'px';
  }

  async function chooseWorkspace(path) {
    try {
      const r = await api('/api/workspace', path ? { path } : {});
      if (r.cancelled) toast('没有选择文件夹');
      else toast('工程目录：' + r.workspace);
    } catch (e) {
      toast(e.message);
    }
  }

  el.input.addEventListener('input', () => {
    autosize();
    el.send.disabled = !el.input.value.trim() || !state?.workspace || state?.status === 'busy';
  });
  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  el.send.addEventListener('click', send);
  el.stop.addEventListener('click', () => api('/api/stop', {}).catch((e) => toast(e.message)));

  el.btnAllow.addEventListener('click', () => {
    const p = state?.pending;
    if (!p) return;
    api('/api/respond', { id: p.id, allow: true, text: el.approvalText.value })
      .catch((e) => toast(e.message));
  });
  el.btnDeny.addEventListener('click', () => {
    const p = state?.pending;
    if (!p) return;
    api('/api/respond', { id: p.id, allow: false, text: '' }).catch((e) => toast(e.message));
  });

  $('btn-new').addEventListener('click', () => {
    const hasTalk = state?.timeline?.some((x) => x.type === 'user');
    if (hasTalk && !confirm(`新对话会清空当前记录，${siteName()} 那边也会开新会话。继续？`)) return;
    api('/api/new', {}).then(() => toast('已开新对话')).catch((e) => toast(e.message));
  });

  $('btn-focus').addEventListener('click', () => {
    api('/api/focus', {}).then((r) => { if (!r.ok) toast(`没找到 ${siteName()} 窗口`); }).catch((e) => toast(e.message));
  });

  $('btn-workspace').addEventListener('click', () => chooseWorkspace(''));
  $('btn-pick').addEventListener('click', () => chooseWorkspace(''));

  $('btn-clear').addEventListener('click', () => {
    nodes.forEach((n) => n.remove());
    nodes.clear();
    sigs.clear();
    toggles.clear();
    lastLen = 0;
    if (state) {
      state.timeline = [];
      renderTimeline();
    }
    autosize();
    toast(`界面已清空，${siteName()} 上下文还在`);
  });

  const warmOtherBrowser = () => {
    if (warmed) return;
    warmed = true;
    api('/api/warm', {}).catch(() => {});
  };
  for (const ev of ['pointerdown', 'focus']) el.browserSelect.addEventListener(ev, warmOtherBrowser);

  el.browserSelect.addEventListener('change', async () => {
    const name = el.browserSelect.value;
    switchingBrowser = true;
    el.browserSelect.disabled = true;
    toast(`正在切到 ${BROWSER_LABEL[name] || name}…`);
    try {
      const r = await api('/api/browser', { name });
      toast(`已切到 ${BROWSER_LABEL[r.browser?.name] || name}`);
    } catch (err) {
      toast(err.message);
    } finally {
      switchingBrowser = false;
      if (state?.browser) el.browserSelect.value = state.browser.name;
    }
  });

  el.siteSelect.addEventListener('change', async () => {
    const key = el.siteSelect.value;
    const label = SITE_LABEL[key] || key;
    const prev = state?.site?.key || 'deepseek';
    switchingSite = true;
    el.siteSelect.disabled = true;
    toast(`正在切到 ${label}…`);
    try {
      const r = await api('/api/site', { key });
      toast(`已切到 ${r.site?.label || label}`);
    } catch (err) {
      toast(err.message);
      el.siteSelect.value = prev;
    } finally {
      switchingSite = false;
      if (state?.site) el.siteSelect.value = state.site.key;
    }
  });

  function rebuildTimeline() {
    for (const node of nodes.values()) node.remove();
    nodes.clear();
    sigs.clear();
    lastLen = 0;
    renderTimeline();
  }

  el.gitEnabled?.addEventListener('change', async () => {
    el.gitEnabled.disabled = true;
    try {
      await api('/api/settings', { gitEnabled: el.gitEnabled.checked });
      rebuildTimeline();
      toast(el.gitEnabled.checked ? 'Git 快照已打开，下一次动手前开始存底' : 'Git 快照已关闭');
    } catch (e) {
      el.gitEnabled.checked = !!state?.settings?.gitEnabled;
      toast(e.message);
    } finally {
      el.gitEnabled.disabled = false;
    }
  });

  el.promptProfile?.addEventListener('change', async () => {
    const value = el.promptProfile.value;
    el.promptProfile.disabled = true;
    try {
      await api('/api/settings', { promptProfile: value });
      toast(value === 'auto' ? '提示词改回跟随本机' : `提示词按 ${value === 'linux' ? 'Linux' : 'Windows'} 写，新对话生效`);
    } catch (e) {
      el.promptProfile.value = state?.settings?.promptProfile || 'auto';
      toast(e.message);
    } finally {
      el.promptProfile.disabled = false;
    }
  });

  el.autoApprove.addEventListener('change', () => {
    api('/api/settings', { autoApprove: el.autoApprove.checked }).catch((e) => toast(e.message));
  });
  el.maxSteps.addEventListener('change', () => {
    const n = Number(el.maxSteps.value);
    if (Number.isFinite(n)) api('/api/settings', { maxSteps: n }).catch((e) => toast(e.message));
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state?.pending) {
      api('/api/respond', { id: state.pending.id, allow: false, text: '' }).catch(() => {});
    }
  });

  fetch('/api/state').then((r) => r.json()).then(applyState).catch(() => {});
  startMascot();
  startMascotDrag();
  connect();
})();
</script>
</body>
</html>
